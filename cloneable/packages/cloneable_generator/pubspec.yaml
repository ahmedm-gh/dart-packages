name: cloneable_generator
description: Code generator for cloneable, creating strongly typed copyWith implementations with explicit null support
version: 1.0.0
repository: https://github.com/ahmedm-gh/dart-packages/tree/main/cloneable/packages/cloneable_generator
issue_tracker: https://github.com/ahmedm-gh/dart-packages/issues
documentation: https://github.com/ahmedm-gh/dart-packages/tree/main/cloneable/packages/cloneable_generator

funding:
  - https://github.com/sponsors/ahmedm-gh
  - https://buymeacoffee.com/ahmeds1

topics:
  - copywith
  - clone
  - code-generation
  - data-class
  - build-runner

environment:
  sdk: '>=3.5.0 <4.0.0'

executables:
  cloneable_generator: cloneable_generator
  cloneable_build: build

resolution: workspace

dependencies:
  analyzer: '>=6.0.0 <7.0.0'
  build: ^2.4.1
  cloneable: ^1.0.0
  dart_style: '>=2.3.0 <4.0.0'
  path: ^1.9.0
  source_gen: ^1.5.0

dev_dependencies:
  build_runner: ^2.4.8
  build_test: ^2.2.2
  lints: ^6.0.0
  test: ^1.25.6
