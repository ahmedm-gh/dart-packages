<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 934" width="1100" height="934" aria-labelledby="t d"><title id="t">dependency_box scope hierarchy and LookupScope boundaries</title><desc id="d">Tree diagram. Root container dbox (DependencyBox.main, depth 0) owns GlobalConfig, AuthService and SharedAnalyticsSession. Its children featureDbox and sessionDbox (createChild, depth 1) are siblings. featureDbox has the child screenDbox (createChild, depth 2). By default, lookups check the local scope first and then continue up through ancestors. Sibling scopes cannot see each other. A table below lists the five LookupScope boundaries: inherited (default), local, parent, ancestors and root, with the scopes each one searches, its cost and its purpose.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}.name{font-size:15px;font-weight:700;fill:#1f2328}.sub{font-size:11.5px;fill:#656d76}.bt{font-size:11px;fill:#57606a;text-anchor:middle}.dep{font-size:13px;font-weight:700;fill:#1f2328}.ty{font-size:11.5px;font-weight:600;text-anchor:end}.card{fill:none;stroke:#d0d7de;stroke-width:1.25}.hd{fill:#f6f8fa}.hd-root{fill:#eaeef2}.badge{stroke:#d0d7de}.badge,.row,.sep{stroke-width:1}.sep{stroke:#d0d7de}.badge{fill:#fff}.row{fill:#f6f8fa;stroke:#d8dee4}.tree{stroke:#8c959f;stroke-width:1.75;fill:none}.node{fill:#8c959f}.look{stroke:#0969da;stroke-width:1.5;fill:none;stroke-dasharray:5 4}.iso-t,.look-t{font-size:11.5px}.look-t{fill:#0969da}.iso-t{fill:#cf222e}.pt{fill:#424a53}.lg,.pn,.pt{font-size:11.5px}.pn{font-weight:700;fill:#8c959f}.lg{fill:#57606a}.c-scoped{fill:#6d28d9}.c-factory{fill:#be185d}.th{font-size:11.5px;font-weight:700;fill:#57606a}.th-s{font-size:10px;fill:#656d76;text-anchor:middle}.td{font-size:11.5px;fill:#424a53}.cost,.ls{font-size:12px;font-weight:700;fill:#1f2328}.pill-o{fill:#fff;stroke:#d0d7de;stroke-width:1}.pill-ot{font-size:10.5px;font-weight:600;fill:#57606a;text-anchor:middle}.chain{stroke:#d0d7de}.chain,.chain-on{stroke-width:1.5}.chain-on,.n-on{stroke:#0969da}.n-off,.n-on{stroke-width:1.25}.n-on{fill:#0969da}.n-off{fill:#fff;stroke:#8c959f}.n-p-off,.n-p-on{stroke-width:1}.n-p-on{fill:#818cf8;stroke:#818cf8}.n-p-off{fill:#fff;stroke:#8c959f}</style><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="m0 0 9 4.5L0 9z" fill="#0969da"/></marker></defs><rect x="1" y="1" width="1098" height="932" rx="18" fill="#fff" stroke="#dce3f0" stroke-width="2"/><text x="32" y="40" style="font-size:20px;font-weight:700;fill:#1f2328">Scope hierarchy (Example)</text><text x="32" y="62" style="font-size:13px;fill:#656d76">Resolution is local-first. With the default <tspan class="mono">LookupScope.inherited</tspan>, a miss continues up the ancestor chain.</text><path class="tree" d="M550 276v22q0 14-14 14H284q-14 0-14 14v20m280-70v22q0 14 14 14h252q14 0 14 14v20M270 490v46"/><circle class="node" cx="550" cy="276" r="3.5"/><circle class="node" cx="270" cy="346" r="3.5"/><circle class="node" cx="830" cy="346" r="3.5"/><circle class="node" cx="270" cy="490" r="3.5"/><circle class="node" cx="270" cy="536" r="3.5"/><path class="look" d="M150 346V130q0-14 14-14h166" marker-end="url(#arrow)"/><text x="164" y="108" class="look-t">resolves upward to dbox</text><path class="look" d="M950 346V130q0-14-14-14H770" marker-end="url(#arrow)"/><text x="936" y="108" class="look-t" text-anchor="end">resolves upward to dbox</text><path class="look" d="M400 536v-46" marker-end="url(#arrow)"/><text x="412" y="510" class="look-t">resolves upward to</text><text x="412" y="524" class="look-t mono" font-size="11">featureDbox → dbox</text><path d="M468 410v14m164-14v14" stroke="#cf222e" stroke-width="1.5" fill="none"/><circle cx="550" cy="417" r="11" fill="#fff" stroke="#cf222e" stroke-width="1.5"/><path d="m545 412 10 10m0-10-10 10" stroke="#cf222e" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="550" y="445" class="iso-t" text-anchor="middle">sibling scopes</text><text x="550" y="460" class="iso-t" text-anchor="middle">can’t see each other</text><rect x="330" y="92" width="440" height="184" rx="10" fill="#fff"/><rect x="330" y="92" width="440" height="48" rx="10" class="hd-root"/><path class="hd-root" d="M330 116h440v24H330z"/><path class="sep" d="M330 140h440"/><text x="346" y="113" class="name mono">dbox</text><text x="346" y="130" class="sub mono">DependencyBox.main()</text><rect x="696" y="106" width="58" height="20" rx="10" class="badge"/><text x="725" y="120" class="bt">depth 0</text><rect x="346" y="150" width="408" height="34" rx="7" class="row"/><circle cx="362" cy="167" r="5" fill="#3b82f6"/><text x="376" y="172" class="dep mono">GlobalConfig</text><text x="740" y="171" class="ty" style="fill:#0969da">Singleton</text><rect x="346" y="190" width="408" height="34" rx="7" class="row"/><circle cx="362" cy="207" r="5" fill="#14b8a6"/><text x="376" y="212" class="dep mono">AuthService</text><text x="740" y="211" class="ty" style="fill:#0f766e">Lazy Singleton</text><rect x="346" y="230" width="408" height="34" rx="7" style="fill:#fffbeb;stroke:#fcd34d;stroke-width:1"/><circle cx="362" cy="247" r="5" fill="#f59e0b"/><text x="376" y="252" class="dep mono">SharedAnalyticsSession</text><text x="740" y="251" class="ty" style="fill:#b45309">Shared · root-anchored</text><rect x="330" y="92" width="440" height="184" rx="10" style="fill:none;stroke:#57606a;stroke-width:1.5"/><rect x="80" y="346" width="380" height="144" rx="10" fill="#fff"/><rect x="80" y="346" width="380" height="48" rx="10" class="hd"/><path class="hd" d="M80 370h380v24H80z"/><path class="sep" d="M80 394h380"/><text x="96" y="367" class="name mono">featureDbox</text><text x="96" y="384" class="sub mono">createChild()</text><rect x="386" y="360" width="58" height="20" rx="10" class="badge"/><text x="415" y="374" class="bt">depth 1</text><rect x="96" y="404" width="348" height="34" rx="7" class="row"/><circle cx="112" cy="421" r="5" fill="#8b5cf6"/><text x="126" y="426" class="dep mono">CheckoutState</text><text x="430" y="425" class="ty c-scoped">Scoped Singleton</text><rect x="96" y="444" width="348" height="34" rx="7" class="row"/><circle cx="112" cy="461" r="5" fill="#ec4899"/><text x="126" y="466" class="dep mono">CartController</text><text x="430" y="465" class="ty c-factory">Factory</text><rect x="80" y="346" width="380" height="144" rx="10" class="card"/><rect x="640" y="346" width="380" height="144" rx="10" fill="#fff"/><rect x="640" y="346" width="380" height="48" rx="10" class="hd"/><path class="hd" d="M640 370h380v24H640z"/><path class="sep" d="M640 394h380"/><text x="656" y="367" class="name mono">sessionDbox</text><text x="656" y="384" class="sub mono">createChild()</text><rect x="946" y="360" width="58" height="20" rx="10" class="badge"/><text x="975" y="374" class="bt">depth 1</text><rect x="656" y="404" width="348" height="34" rx="7" class="row"/><circle cx="672" cy="421" r="5" fill="#8b5cf6"/><text x="686" y="426" class="dep mono">UserContext</text><text x="990" y="425" class="ty c-scoped">Scoped Singleton</text><rect x="656" y="444" width="348" height="34" rx="7" class="row"/><circle cx="672" cy="461" r="5" fill="#ec4899"/><text x="686" y="466" class="dep mono">SessionLogger</text><text x="990" y="465" class="ty c-factory">Factory</text><rect x="640" y="346" width="380" height="144" rx="10" class="card"/><rect x="80" y="536" width="380" height="104" rx="10" fill="#fff"/><rect x="80" y="536" width="380" height="48" rx="10" class="hd"/><path class="hd" d="M80 560h380v24H80z"/><path class="sep" d="M80 584h380"/><text x="96" y="557" class="name mono">screenDbox</text><text x="96" y="574" class="sub mono">createChild()</text><rect x="386" y="550" width="58" height="20" rx="10" class="badge"/><text x="415" y="564" class="bt">depth 2</text><rect x="96" y="594" width="348" height="34" rx="7" class="row"/><circle cx="112" cy="611" r="5" fill="#8b5cf6"/><text x="126" y="616" class="dep mono">ReceiptPrinter</text><text x="430" y="615" class="ty c-scoped">Scoped Singleton</text><rect x="80" y="536" width="380" height="104" rx="10" class="card"/><rect x="550" y="536" width="470" height="104" rx="10" style="fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.25"/><text x="566" y="556" style="font-size:12px;font-weight:700;fill:#1f2328">Resolution rules</text><text x="566" y="577" class="pn">1</text><text x="582" y="577" class="pt">Check the current scope first, then parent → … → root (default <tspan class="mono" font-size="11">inherited</tspan>).</text><text x="566" y="593" class="pn">2</text><text x="582" y="593" class="pt">Siblings can’t see each other; parents can’t see children.</text><text x="566" y="609" class="pn">3</text><text x="582" y="609" class="pt"><tspan class="mono" font-size="11">scope:</tspan> picks a boundary per call — see the table below.</text><text x="566" y="625" class="pn">4</text><text x="582" y="625" class="pt"><tspan class="mono" font-size="11">addShared*</tspan> keeps ownership at root, even when called on a child.</text><path class="sep" d="M32 664h1036"/><circle cx="46" cy="687" r="5" fill="#3b82f6"/><text x="58" y="691" class="lg">Singleton</text><circle cx="148" cy="687" r="5" fill="#14b8a6"/><text x="160" y="691" class="lg">Lazy Singleton</text><circle cx="262" cy="687" r="5" fill="#8b5cf6"/><text x="274" y="691" class="lg">Scoped Singleton</text><circle cx="388" cy="687" r="5" fill="#ec4899"/><text x="400" y="691" class="lg">Factory</text><circle cx="468" cy="687" r="5" fill="#f59e0b"/><text x="480" y="691" class="lg">Shared · root-anchored</text><path class="tree" d="M650 687h28"/><text x="686" y="691" class="lg">parent → child</text><path class="look" d="M800 687h28"/><text x="836" y="691" class="lg">lookup direction</text><path style="stroke:#cf222e;stroke-width:1.5;fill:none;stroke-dasharray:5 4" d="M960 687h28"/><text x="996" y="691" class="lg">isolated</text><text x="32" y="730" style="font-size:14px;font-weight:700;fill:#1f2328">LookupScope (boundaries)</text><text x="1068" y="730" class="sub" text-anchor="end">Pass <tspan class="mono" font-size="11">scope:</tspan> to <tspan class="mono" font-size="11">get()</tspan>, <tspan class="mono" font-size="11">tryGet()</tspan>, <tspan class="mono" font-size="11">contains()</tspan>, <tspan class="mono" font-size="11">getAll()</tspan> and the async variants. <tspan class="mono" font-size="11">d</tspan> = scope depth.</text><rect x="32" y="744" width="1036" height="166" rx="10" fill="#fff"/><rect x="32" y="744" width="1036" height="26" rx="10" class="hd"/><path class="hd" d="M32 757h1036v13H32z"/><path style="fill:#f0f7ff" d="M33 771h1034v27H33z"/><path class="sep" d="M32 770h1036M32 798h1036M32 826h1036M32 854h1036M32 882h1036"/><text x="48" y="761" class="th">Scope</text><text x="148" y="761" class="th">Role</text><text x="228" y="760" class="th-s">this</text><text x="264" y="760" class="th-s">parent</text><text x="344" y="760" class="th-s">… other parents …</text><text x="428" y="760" class="th-s">root</text><text x="464" y="761" class="th">Boundary</text><text x="650" y="761" class="th">Cost</text><text x="705" y="761" class="th">Purpose</text><text x="48" y="788" class="ls mono">inherited</text><rect x="148" y="775" width="52" height="18" rx="9" style="fill:#ddf4ff;stroke:#54aeff;stroke-width:1"/><text x="174" y="788" style="font-size:10.5px;font-weight:700;fill:#0969da;text-anchor:middle">Default</text><path class="chain-on" d="M228 784h200"/><circle cx="228" cy="784" r="5" class="n-on"/><circle cx="264" cy="784" r="5" class="n-on"/><circle cx="296" cy="784" r="2.5" class="n-p-on"/><circle cx="328" cy="784" r="2.5" class="n-p-on"/><circle cx="360" cy="784" r="2.5" class="n-p-on"/><circle cx="392" cy="784" r="2.5" class="n-p-on"/><circle cx="428" cy="784" r="5" class="n-on"/><text x="464" y="788" class="td">this → parent → … → root</text><text x="650" y="788" class="cost mono">O(d)</text><text x="705" y="788" class="td">Standard lexical scoping: local first, then upward.</text><text x="48" y="816" class="ls mono">local</text><rect x="148" y="803" width="52" height="18" rx="9" class="pill-o"/><text x="174" y="816" class="pill-ot">Opt-in</text><path class="chain" d="M228 812h200"/><circle cx="228" cy="812" r="5" class="n-on"/><circle cx="264" cy="812" r="5" class="n-off"/><circle cx="296" cy="812" r="2.5" class="n-p-off"/><circle cx="328" cy="812" r="2.5" class="n-p-off"/><circle cx="360" cy="812" r="2.5" class="n-p-off"/><circle cx="392" cy="812" r="2.5" class="n-p-off"/><circle cx="428" cy="812" r="5" class="n-off"/><text x="464" y="816" class="td">this container only</text><text x="650" y="816" class="cost mono">O(1)</text><text x="705" y="816" class="td">Strict modular isolation; never looks at parents.</text><text x="48" y="844" class="ls mono">parent</text><rect x="148" y="831" width="52" height="18" rx="9" class="pill-o"/><text x="174" y="844" class="pill-ot">Opt-in</text><path class="chain" d="M228 840h200"/><circle cx="228" cy="840" r="5" class="n-off"/><circle cx="264" cy="840" r="5" class="n-on"/><circle cx="296" cy="840" r="2.5" class="n-p-off"/><circle cx="328" cy="840" r="2.5" class="n-p-off"/><circle cx="360" cy="840" r="2.5" class="n-p-off"/><circle cx="392" cy="840" r="2.5" class="n-p-off"/><circle cx="428" cy="840" r="5" class="n-off"/><text x="464" y="844" class="td">direct parent only (1 hop)</text><text x="650" y="844" class="cost mono">O(1)</text><text x="705" y="844" class="td">Direct parent only; bypasses local and higher scopes.</text><text x="48" y="872" class="ls mono">ancestors</text><rect x="148" y="859" width="52" height="18" rx="9" class="pill-o"/><text x="174" y="872" class="pill-ot">Opt-in</text><path class="chain" d="M228 868h200"/><path class="chain-on" d="M264 868h164"/><circle cx="228" cy="868" r="5" class="n-off"/><circle cx="264" cy="868" r="5" class="n-on"/><circle cx="296" cy="868" r="2.5" class="n-p-on"/><circle cx="328" cy="868" r="2.5" class="n-p-on"/><circle cx="360" cy="868" r="2.5" class="n-p-on"/><circle cx="392" cy="868" r="2.5" class="n-p-on"/><circle cx="428" cy="868" r="5" class="n-on"/><text x="464" y="872" class="td">parent → … → root (skips this)</text><text x="650" y="872" class="cost mono">O(d)</text><text x="705" y="872" class="td">Decorator / “super” pattern; skips local overrides.</text><text x="48" y="900" class="ls mono">root</text><rect x="148" y="887" width="52" height="18" rx="9" class="pill-o"/><text x="174" y="900" class="pill-ot">Opt-in</text><path class="chain" d="M228 896h200"/><circle cx="228" cy="896" r="5" class="n-off"/><circle cx="264" cy="896" r="5" class="n-off"/><circle cx="296" cy="896" r="2.5" class="n-p-off"/><circle cx="328" cy="896" r="2.5" class="n-p-off"/><circle cx="360" cy="896" r="2.5" class="n-p-off"/><circle cx="392" cy="896" r="2.5" class="n-p-off"/><circle cx="428" cy="896" r="5" class="n-on"/><text x="464" y="900" class="td">root container only</text><text x="650" y="900" class="cost mono">O(1)</text><text x="705" y="900" class="td">Global singletons; bypasses all intermediate scopes.</text><rect x="32" y="744" width="1036" height="166" rx="10" class="card"/></svg>