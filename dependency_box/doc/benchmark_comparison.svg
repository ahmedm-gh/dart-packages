<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" aria-labelledby="t d"><title id="t">dependency_box vs get_it 9.3.0 speedup ranges</title><desc id="d">dependency_box is faster than get_it in all 27 benchmarks. Overall speedup ranges from about 1.33 to 26.7 times on Native AOT and from about 1.52 to 15.3 times on JIT. Each bar starts at get_it and its solid part spans the smallest to the biggest speedup on a shared logarithmic 1 to 30 times scale, with get_it at 1 times.</desc><rect x="1" y="1" width="998" height="638" rx="18" fill="#fff" stroke="#dce3f0" stroke-width="2"/><text x="40" y="56" font-size="30" font-weight="800" fill="#0d1b3e">dependency_box vs get_it 9.3.0</text><text x="40" y="84" font-size="16" font-weight="500" fill="#5a6b87">Faster in every benchmark. Bars start at get_it 9.3.0 (1×) and show how far dependency_box gets beyond it.</text><rect x="40" y="104" width="12" height="12" rx="3" fill="#e05252"/><text x="60" y="115" font-size="13" font-weight="600" fill="#334155">get_it 9.3.0 (1×)</text><rect x="200" y="104" width="22" height="12" rx="3" fill="#0b3b75" fill-opacity=".28"/><rect x="209" y="104" width="13" height="12" rx="3" fill="#0b3b75"/><rect x="226" y="104" width="22" height="12" rx="3" fill="#5a45ff" fill-opacity=".28"/><rect x="235" y="104" width="13" height="12" rx="3" fill="#5a45ff"/><text x="256" y="115" font-size="13" font-weight="600" fill="#334155">dependency_box</text><text x="330" y="152" font-size="17" font-weight="800" fill="#0b3b75">Native AOT</text><text x="670" y="152" font-size="17" font-weight="800" fill="#5a45ff">JIT</text><rect x="24" y="166" width="952" height="98" rx="12" fill="#f5f7fc" stroke="#e3e9f4" stroke-width="1.5"/><text x="40" y="209" font-size="18" font-weight="700" fill="#1e293b">All workloads</text><text x="40" y="229" font-size="13" font-weight="500" fill="#64748b">27 benchmarks</te