<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8faff" />
      <stop offset="100%" stop-color="#f0f4fc" />
    </linearGradient>
    <linearGradient id="purpleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a45ff" />
      <stop offset="100%" stop-color="#3b28cc" />
    </linearGradient>
    <linearGradient id="greyBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c8b9e" />
      <stop offset="100%" stop-color="#566578" />
    </linearGradient>
    <style>
      .title { font-size: 32px; font-weight: 800; fill: #0d1b3e; }
      .subtitle { font-size: 15.5px; fill: #5a6b87; font-weight: 500; }
      .legend-text { font-size: 17px; font-weight: 700; fill: #1e293b; }
      .panel { fill: #ffffff; stroke: #dce3f0; stroke-width: 1.5; rx: 14; }
      .panel-title { font-size: 19px; font-weight: 800; fill: #0d1b3e; letter-spacing: 0.3px; }
      .axis-label { font-size: 13.5px; fill: #64748b; font-weight: 600; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1; }
      .axis-line { stroke: #475569; stroke-width: 1.5; }
      .speedup-text { font-size: 15px; font-weight: 800; fill: #047857; text-anchor: middle; letter-spacing: -0.2px; }
      /* Numbers above bars decreased by 10% from 13.5px to 12px */
      .val-purple { font-size: 12px; font-weight: 800; fill: #4338ca; text-anchor: middle; }
      .val-grey { font-size: 12px; font-weight: 800; fill: #334155; text-anchor: middle; }
      .cat-label { font-size: 14px; font-weight: 700; fill: #334155; text-anchor: start; }
      .card { fill: #f4f7fd; stroke: #dce3f0; stroke-width: 1.5; rx: 14; }
      .card-title { font-size: 16px; font-weight: 800; fill: #0d1b3e; }
      .card-sub { font-size: 13px; fill: #475569; font-weight: 500; }
      .big-metric-jit { font-size: 34px; font-weight: 800; fill: #4f39f6; }
      .big-metric-aot { font-size: 34px; font-weight: 800; fill: #0353a4; }
      .mid-metric { font-size: 20px; font-weight: 800; }
      .footer { font-size: 13px; fill: #64748b; font-weight: 500; }
    </style>

  </defs>

  <!-- Background -->
  <rect width="1200" height="580" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- HEADER -->
  <text x="25" y="44" class="title">DI Performance Benchmark · AOT Resolution</text>
  <text x="25" y="68" class="subtitle">dependency_box vs get_it 9.3.0  ·  Dart 3.13.4  ·  Windows x64  ·  Median latency  ·  Lower is faster</text>

  <!-- Badge -->
  <rect x="995" y="20" width="180" height="42" rx="21" fill="#0b3b75" />
  <text x="1085" y="47" fill="#ffffff" font-size="16.5" font-weight="800" text-anchor="middle">AOT · 27.71× max</text>

  <!-- Legend -->
  <rect x="25" y="86" width="20" height="20" rx="4" fill="url(#purpleBar)" />
  <text x="54" y="102" class="legend-text">dependency_box</text>

  <rect x="210" y="86" width="20" height="20" rx="4" fill="url(#greyBar)" />
  <text x="239" y="102" class="legend-text">get_it 9.3.0</text>

  <!-- AOT · RESOLUTION WORKLOADS -->
  <g transform="translate(25, 125)">
    <rect width="1150" height="410" class="panel" />
    <text x="25" y="32" class="panel-title">AOT · RESOLUTION WORKLOADS</text>
    <!-- Speedup Values (Clean green text) -->
    <text x="153.8" y="62" class="speedup-text">27.71×</text>
    <text x="231.2" y="62" class="speedup-text">27.29×</text>
    <text x="308.8" y="62" class="speedup-text">19.28×</text>
    <text x="386.2" y="62" class="speedup-text">19.49×</text>
    <text x="463.8" y="62" class="speedup-text">17.15×</text>
    <text x="541.2" y="62" class="speedup-text">1.65×</text>
    <text x="618.8" y="62" class="speedup-text">15.72×</text>
    <text x="696.2" y="62" class="speedup-text">13.87×</text>
    <text x="773.8" y="62" class="speedup-text">14.00×</text>
    <text x="851.2" y="62" class="speedup-text">19.74×</text>
    <text x="928.8" y="62" class="speedup-text">2.38×</text>
    <text x="1006.2" y="62" class="speedup-text">1.73×</text>
    <!-- Y-Axis & Grid -->
    <text x="-165" y="18" transform="rotate(-90)" class="axis-label" text-anchor="middle">Latency (ns)</text>
    <text x="88" y="95" class="axis-label" text-anchor="end">4,000+</text>
    <line x1="95" y1="90" x2="1125" y2="90" class="grid-line" />
    <text x="88" y="137" class="axis-label" text-anchor="end">3,000</text>
    <line x1="95" y1="132" x2="1125" y2="132" class="grid-line" />
    <text x="88" y="177" class="axis-label" text-anchor="end">2,000</text>
    <line x1="95" y1="172" x2="1125" y2="172" class="grid-line" />
    <text x="88" y="219" class="axis-label" text-anchor="end">1,000</text>
    <line x1="95" y1="214" x2="1125" y2="214" class="grid-line" />
    <text x="88" y="260" class="axis-label" text-anchor="end">0</text>
    <line x1="95" y1="80" x2="95" y2="255" class="axis-line" />
    <line x1="95" y1="255" x2="1125" y2="255" class="axis-line" />
    <!-- 1. Pre-Registered (cx=153.8) -->
    <path d="M 124.8,255 V 252.5 Q 124.8,250.0 127.3,250.0 H 150.3 Q 152.8,250.0 152.8,252.5 V 255 Z" fill="url(#purpleBar)" />
    <text x="138.8" y="244.0" class="val-purple">13</text>
    <path d="M 154.8,255 V 243.0 Q 154.8,238.0 159.8,238.0 H 177.8 Q 182.8,238.0 182.8,243.0 V 255 Z" fill="url(#greyBar)" />
    <text x="168.8" y="232.0" class="val-grey">362</text>
    <text x="147.8" y="269" transform="rotate(45 147.8,269)" class="cat-label">Pre-Registered</text>
    <!-- 2. Cached Lazy (cx=231.2) -->
    <path d="M 202.2,255 V 252.5 Q 202.2,250.0 204.7,250.0 H 227.7 Q 230.2,250.0 230.2,252.5 V 255 Z" fill="url(#purpleBar)" />
    <text x="216.2" y="244.0" class="val-purple">13</text>
    <path d="M 232.2,255 V 243.0 Q 232.2,238.0 237.2,238.0 H 255.2 Q 260.2,238.0 260.2,243.0 V 255 Z" fill="url(#greyBar)" />
    <text x="246.2" y="232.0" class="val-grey">362</text>
    <text x="225.2" y="269" transform="rotate(45 225.2,269)" class="cat-label">Cached Lazy</text>
    <!-- 3. Transient Factory (cx=308.8) -->
    <path d="M 279.8,255 V 252.0 Q 279.8,249.0 282.8,249.0 H 304.8 Q 307.8,249.0 307.8,252.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="293.8" y="243.0" class="val-purple">19</text>
    <path d="M 309.8,255 V 242.5 Q 309.8,237.5 314.8,237.5 H 332.8 Q 337.8,237.5 337.8,242.5 V 255 Z" fill="url(#greyBar)" />
    <text x="323.8" y="231.5" class="val-grey">367</text>
    <text x="302.8" y="269" transform="rotate(45 302.8,269)" class="cat-label">Transient Factory</text>
    <!-- 4. Interface Mapping (cx=386.2) -->
    <path d="M 357.2,255 V 252.5 Q 357.2,250.0 359.7,250.0 H 382.7 Q 385.2,250.0 385.2,252.5 V 255 Z" fill="url(#purpleBar)" />
    <text x="371.2" y="244.0" class="val-purple">16</text>
    <path d="M 387.2,255 V 244.5 Q 387.2,239.5 392.2,239.5 H 410.2 Q 415.2,239.5 415.2,244.5 V 255 Z" fill="url(#greyBar)" />
    <text x="401.2" y="233.5" class="val-grey">312</text>
    <text x="380.2" y="269" transform="rotate(45 380.2,269)" class="cat-label">Interface Mapping</text>
    <!-- 5. Keyed / Named (cx=463.8) -->
    <path d="M 434.8,255 V 251.5 Q 434.8,248.0 438.3,248.0 H 459.3 Q 462.8,248.0 462.8,251.5 V 255 Z" fill="url(#purpleBar)" />
    <text x="448.8" y="242.0" class="val-purple">24</text>
    <path d="M 464.8,255 V 240.0 Q 464.8,235.0 469.8,235.0 H 487.8 Q 492.8,235.0 492.8,240.0 V 255 Z" fill="url(#greyBar)" />
    <text x="478.8" y="229.0" class="val-grey">405</text>
    <text x="457.8" y="269" transform="rotate(45 457.8,269)" class="cat-label">Keyed / Named</text>
    <!-- 6. Parameterized Factory (cx=541.2) -->
    <path d="M 512.2,255 V 244.0 Q 512.2,239.0 517.2,239.0 H 535.2 Q 540.2,239.0 540.2,244.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="526.2" y="233.0" class="val-purple">253</text>
    <path d="M 542.2,255 V 239.5 Q 542.2,234.5 547.2,234.5 H 565.2 Q 570.2,234.5 570.2,239.5 V 255 Z" fill="url(#greyBar)" />
    <text x="556.2" y="228.5" class="val-grey">417</text>
    <text x="535.2" y="269" transform="rotate(45 535.2,269)" class="cat-label">Parameterized Factory</text>
    <!-- 7. Shallow Graph (4 deps) (cx=618.8) -->
    <path d="M 589.8,255 V 249.0 Q 589.8,244.0 594.8,244.0 H 612.8 Q 617.8,244.0 617.8,249.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="603.8" y="238.0" class="val-purple">116</text>
    <path d="M 619.8,255 V 188.0 Q 619.8,183.0 624.8,183.0 H 642.8 Q 647.8,183.0 647.8,188.0 V 255 Z" fill="url(#greyBar)" />
    <text x="633.8" y="177.0" class="val-grey">1,830</text>
    <text x="612.8" y="269" transform="rotate(45 612.8,269)" class="cat-label">Shallow Graph (4 deps)</text>
    <!-- 8. Deep 10-Level Chain (cx=696.2) -->
    <path d="M 667.2,255 V 242.0 Q 667.2,237.0 672.2,237.0 H 690.2 Q 695.2,237.0 695.2,242.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="681.2" y="231.0" class="val-purple">278</text>
    <path d="M 697.2,255 V 105.0 Q 697.2,100.0 702.2,100.0 H 720.2 Q 725.2,100.0 725.2,105.0 V 255 Z" fill="url(#greyBar)" />
    <text x="711.2" y="94.0" class="val-grey">3,860</text>
    <text x="690.2" y="269" transform="rotate(45 690.2,269)" class="cat-label">Deep 10-Level Chain</text>
    <!-- 9. Shared Graph (Diamond) (cx=773.8) -->
    <path d="M 744.8,255 V 246.0 Q 744.8,241.0 749.8,241.0 H 767.8 Q 772.8,241.0 772.8,246.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="758.8" y="235.0" class="val-purple">181</text>
    <path d="M 774.8,255 V 158.0 Q 774.8,153.0 779.8,153.0 H 797.8 Q 802.8,153.0 802.8,158.0 V 255 Z" fill="url(#greyBar)" />
    <text x="788.8" y="147.0" class="val-grey">2,530</text>
    <text x="767.8" y="269" transform="rotate(45 767.8,269)" class="cat-label">Shared Graph (Diamond)</text>
    <!-- 10. Enterprise Graph (cx=851.2) -->
    <path d="M 822.2,255 V 249.0 Q 822.2,244.0 827.2,244.0 H 845.2 Q 850.2,244.0 850.2,249.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="836.2" y="238.0" class="val-purple">102</text>
    <path d="M 852.2,255 V 178.0 Q 852.2,173.0 857.2,173.0 H 875.2 Q 880.2,173.0 880.2,178.0 V 255 Z" fill="url(#greyBar)" />
    <text x="866.2" y="167.0" class="val-grey">2,010</text>
    <text x="845.2" y="269" transform="rotate(45 845.2,269)" class="cat-label">Enterprise Graph</text>
    <!-- 11. Async Singleton (cx=928.8) -->
    <path d="M 899.8,255 V 244.0 Q 899.8,239.0 904.8,239.0 H 922.8 Q 927.8,239.0 927.8,244.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="913.8" y="233.0" class="val-purple">261</text>
    <path d="M 929.8,255 V 230.0 Q 929.8,225.0 934.8,225.0 H 952.8 Q 957.8,225.0 957.8,230.0 V 255 Z" fill="url(#greyBar)" />
    <text x="943.8" y="219.0" class="val-grey">620</text>
    <text x="922.8" y="269" transform="rotate(45 922.8,269)" class="cat-label">Async Singleton</text>
    <!-- 12. Missing Registration (cx=1006.2) -->
    <path d="M 977.2,255 V 253.0 Q 977.2,251.0 979.2,251.0 H 1003.2 Q 1005.2,251.0 1005.2,253.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="991.2" y="245.0" class="val-purple">8</text>
    <path d="M 1007.2,255 V 252.0 Q 1007.2,249.0 1010.2,249.0 H 1032.2 Q 1035.2,249.0 1035.2,252.0 V 255 Z" fill="url(#greyBar)" />
    <text x="1021.2" y="243.0" class="val-grey">14</text>
    <text x="1000.2" y="269" transform="rotate(45 1000.2,269)" class="cat-label">Missing Registration</text>
  </g>


  <!-- FOOTER -->
  <text x="25" y="560" class="footer">Median of 20 independent runs  ·  Dart SDK 3.13.4  ·  Windows 11 Pro  ·  16 processors  ·  Lower is faster</text>
  <text x="1175" y="560" class="footer" text-anchor="end">dependency_box vs get_it 9.3.0</text>
</svg>
