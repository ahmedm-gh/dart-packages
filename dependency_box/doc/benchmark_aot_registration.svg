<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8faff" />
      <stop offset="100%" stop-color="#f0f4fc" />
    </linearGradient>
    <linearGradient id="purpleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a45ff" />
      <stop offset="100%" stop-color="#3b28cc" />
    </linearGradient>
    <linearGradient id="greyBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c8b9e" />
      <stop offset="100%" stop-color="#566578" />
    </linearGradient>
    <style>
      .title { font-size: 32px; font-weight: 800; fill: #0d1b3e; }
      .subtitle { font-size: 15.5px; fill: #5a6b87; font-weight: 500; }
      .legend-text { font-size: 17px; font-weight: 700; fill: #1e293b; }
      .panel { fill: #ffffff; stroke: #dce3f0; stroke-width: 1.5; rx: 14; }
      .panel-title { font-size: 19px; font-weight: 800; fill: #0d1b3e; letter-spacing: 0.3px; }
      .axis-label { font-size: 13.5px; fill: #64748b; font-weight: 600; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1; }
      .axis-line { stroke: #475569; stroke-width: 1.5; }
      .speedup-text { font-size: 15px; font-weight: 800; fill: #047857; text-anchor: middle; letter-spacing: -0.2px; }
      /* Numbers above bars decreased by 10% from 13.5px to 12px */
      .val-purple { font-size: 12px; font-weight: 800; fill: #4338ca; text-anchor: middle; }
      .val-grey { font-size: 12px; font-weight: 800; fill: #334155; text-anchor: middle; }
      .cat-label { font-size: 14px; font-weight: 700; fill: #334155; text-anchor: start; }
      .card { fill: #f4f7fd; stroke: #dce3f0; stroke-width: 1.5; rx: 14; }
      .card-title { font-size: 16px; font-weight: 800; fill: #0d1b3e; }
      .card-sub { font-size: 13px; fill: #475569; font-weight: 500; }
      .big-metric-jit { font-size: 34px; font-weight: 800; fill: #4f39f6; }
      .big-metric-aot { font-size: 34px; font-weight: 800; fill: #0353a4; }
      .mid-metric { font-size: 20px; font-weight: 800; }
      .footer { font-size: 13px; fill: #64748b; font-weight: 500; }
    </style>

  </defs>

  <!-- Background -->
  <rect width="1200" height="580" rx="16" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- HEADER -->
  <text x="25" y="44" class="title">DI Performance Benchmark · AOT Registration &amp; Scaling</text>
  <text x="25" y="68" class="subtitle">dependency_box vs get_it 9.3.0  ·  Dart 3.13.4  ·  Windows x64  ·  Median latency  ·  Lower is faster</text>

  <!-- Badge -->
  <rect x="995" y="20" width="180" height="42" rx="21" fill="#0b3b75" />
  <text x="1085" y="47" fill="#ffffff" font-size="16.5" font-weight="800" text-anchor="middle">AOT · 27.32× max</text>

  <!-- Legend -->
  <rect x="25" y="86" width="20" height="20" rx="4" fill="url(#purpleBar)" />
  <text x="54" y="102" class="legend-text">dependency_box</text>

  <rect x="210" y="86" width="20" height="20" rx="4" fill="url(#greyBar)" />
  <text x="239" y="102" class="legend-text">get_it 9.3.0</text>

  <!-- AOT · REGISTRATION / LIFECYCLE / SCALING -->
  <g transform="translate(25, 125)">
    <rect width="1150" height="410" class="panel" />
    <text x="25" y="32" class="panel-title">AOT · REGISTRATION / LIFECYCLE / SCALING</text>
    <!-- Speedup Values (Clean green text) -->
    <text x="166.7" y="62" class="speedup-text">2.30×</text>
    <text x="270.0" y="62" class="speedup-text">5.79×</text>
    <text x="373.3" y="62" class="speedup-text">6.35×</text>
    <text x="476.7" y="62" class="speedup-text">5.70×</text>
    <text x="580.0" y="62" class="speedup-text">5.58×</text>
    <text x="683.3" y="62" class="speedup-text">2.22×</text>
    <text x="786.7" y="62" class="speedup-text">27.32×</text>
    <text x="890.0" y="62" class="speedup-text">6.13×</text>
    <text x="993.3" y="62" class="speedup-text">5.19×</text>
    <!-- Y-Axis & Grid -->
    <text x="-165" y="18" transform="rotate(-90)" class="axis-label" text-anchor="middle">Latency (ns)</text>
    <text x="88" y="95" class="axis-label" text-anchor="end">20,000+</text>
    <line x1="95" y1="90" x2="1125" y2="90" class="grid-line" />
    <text x="88" y="135" class="axis-label" text-anchor="end">15,000</text>
    <line x1="95" y1="130" x2="1125" y2="130" class="grid-line" />
    <text x="88" y="175" class="axis-label" text-anchor="end">10,000</text>
    <line x1="95" y1="170" x2="1125" y2="170" class="grid-line" />
    <text x="88" y="217" class="axis-label" text-anchor="end">5,000</text>
    <line x1="95" y1="212" x2="1125" y2="212" class="grid-line" />
    <text x="88" y="260" class="axis-label" text-anchor="end">0</text>
    <line x1="95" y1="80" x2="95" y2="255" class="axis-line" />
    <line x1="95" y1="255" x2="1125" y2="255" class="axis-line" />
    <!-- 1. Register 1 Singleton (cx=166.7) -->
    <path d="M 126.2,255 V 251.5 Q 126.2,248.0 129.7,248.0 H 161.7 Q 165.2,248.0 165.2,251.5 V 255 Z" fill="url(#purpleBar)" />
    <text x="145.7" y="242.0" class="val-purple">89</text>
    <path d="M 168.2,255 V 246.5 Q 168.2,241.5 173.2,241.5 H 202.2 Q 207.2,241.5 207.2,246.5 V 255 Z" fill="url(#greyBar)" />
    <text x="187.7" y="235.5" class="val-grey">204</text>
    <text x="160.7" y="269" transform="rotate(45 160.7,269)" class="cat-label">Register 1 Singleton</text>
    <!-- 2. Register 10 Singletons (cx=270.0) -->
    <path d="M 229.5,255 V 249.0 Q 229.5,244.0 234.5,244.0 H 263.5 Q 268.5,244.0 268.5,249.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="249.0" y="238.0" class="val-purple">852</text>
    <path d="M 271.5,255 V 232.0 Q 271.5,227.0 276.5,227.0 H 305.5 Q 310.5,227.0 310.5,232.0 V 255 Z" fill="url(#greyBar)" />
    <text x="291.0" y="221.0" class="val-grey">4,930</text>
    <text x="264.0" y="269" transform="rotate(45 264.0,269)" class="cat-label">Register 10 Singletons</text>
    <!-- 3. Register 100 Singletons (cx=373.3) -->
    <path d="M 332.8,255 V 236.0 Q 332.8,231.0 337.8,231.0 H 366.8 Q 371.8,231.0 371.8,236.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="352.3" y="225.0" class="val-purple">8,220</text>
    <path d="M 374.8,255 V 192.0 Q 374.8,187.0 379.8,187.0 H 408.8 Q 413.8,187.0 413.8,192.0 V 255 Z" fill="url(#greyBar)" />
    <text x="394.3" y="181.0" class="val-grey">52,100</text>
    <text x="367.3" y="269" transform="rotate(45 367.3,269)" class="cat-label">Register 100 Singletons</text>
    <!-- 4. Register 10 Lazy (cx=476.7) -->
    <path d="M 436.2,255 V 249.0 Q 436.2,244.0 441.2,244.0 H 470.2 Q 475.2,244.0 475.2,249.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="455.7" y="238.0" class="val-purple">808</text>
    <path d="M 478.2,255 V 234.0 Q 478.2,229.0 483.2,229.0 H 512.2 Q 517.2,229.0 517.2,234.0 V 255 Z" fill="url(#greyBar)" />
    <text x="497.7" y="223.0" class="val-grey">4,600</text>
    <text x="470.7" y="269" transform="rotate(45 470.7,269)" class="cat-label">Register 10 Lazy</text>
    <!-- 5. Register 10 Factories (cx=580.0) -->
    <path d="M 539.5,255 V 249.0 Q 539.5,244.0 544.5,244.0 H 573.5 Q 578.5,244.0 578.5,249.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="559.0" y="238.0" class="val-purple">813</text>
    <path d="M 581.5,255 V 234.0 Q 581.5,229.0 586.5,229.0 H 615.5 Q 620.5,229.0 620.5,234.0 V 255 Z" fill="url(#greyBar)" />
    <text x="601.0" y="223.0" class="val-grey">4,540</text>
    <text x="574.0" y="269" transform="rotate(45 574.0,269)" class="cat-label">Register 10 Factories</text>
    <!-- 6. Scoped Lifecycle (cx=683.3) -->
    <path d="M 642.8,255 V 250.0 Q 642.8,246.0 646.8,246.0 H 677.8 Q 681.8,246.0 681.8,250.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="662.3" y="240.0" class="val-purple">585</text>
    <path d="M 684.8,255 V 243.0 Q 684.8,238.0 689.8,238.0 H 718.8 Q 723.8,238.0 723.8,243.0 V 255 Z" fill="url(#greyBar)" />
    <text x="704.3" y="232.0" class="val-grey">1,300</text>
    <text x="677.3" y="269" transform="rotate(45 677.3,269)" class="cat-label">Scoped Lifecycle</text>
    <!-- 7. Weak-Ref Factory (cx=786.7) -->
    <path d="M 746.2,255 V 252.5 Q 746.2,250.0 748.7,250.0 H 782.7 Q 785.2,250.0 785.2,252.5 V 255 Z" fill="url(#purpleBar)" />
    <text x="765.7" y="244.0" class="val-purple">14</text>
    <path d="M 788.2,255 V 242.0 Q 788.2,237.0 793.2,237.0 H 822.2 Q 827.2,237.0 827.2,242.0 V 255 Z" fill="url(#greyBar)" />
    <text x="807.7" y="231.0" class="val-grey">373</text>
    <text x="780.7" y="269" transform="rotate(45 780.7,269)" class="cat-label">Weak-Ref Factory</text>
    <!-- 8. 1,000 Scaling (1k) (cx=890.0) -->
    <path d="M 849.5,255 V 233.0 Q 849.5,228.0 854.5,228.0 H 883.5 Q 888.5,228.0 888.5,233.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="869.0" y="222.0" class="val-purple">86,300</text>
    <path d="M 891.5,255 V 188.0 Q 891.5,183.0 896.5,183.0 H 925.5 Q 930.5,183.0 930.5,188.0 V 255 Z" fill="url(#greyBar)" />
    <text x="911.0" y="177.0" class="val-grey">529k</text>
    <text x="884.0" y="269" transform="rotate(45 884.0,269)" class="cat-label">1,000 Scaling (1k)</text>
    <!-- 9. 10,000 Scaling (10k) (cx=993.3) -->
    <path d="M 952.8,255 V 214.0 Q 952.8,209.0 957.8,209.0 H 986.8 Q 991.8,209.0 991.8,214.0 V 255 Z" fill="url(#purpleBar)" />
    <text x="972.3" y="203.0" class="val-purple">1,490k</text>
    <path d="M 994.8,255 V 104.0 Q 994.8,99.0 999.8,99.0 H 1028.8 Q 1033.8,99.0 1033.8,104.0 V 255 Z" fill="url(#greyBar)" />
    <text x="1014.3" y="93.0" class="val-grey">7,740k</text>
    <text x="987.3" y="269" transform="rotate(45 987.3,269)" class="cat-label">10,000 Scaling (10k)</text>
  </g>


  <!-- FOOTER -->
  <text x="25" y="560" class="footer">Median of 20 independent runs  ·  Dart SDK 3.13.4  ·  Windows 11 Pro  ·  16 processors  ·  Lower is faster</text>
  <text x="1175" y="560" class="footer" text-anchor="end">dependency_box vs get_it 9.3.0</text>
</svg>
